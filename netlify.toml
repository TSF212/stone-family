[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── Détection automatique par langue du navigateur ──
# L'ordre est important : du plus spécifique au moins spécifique

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = false
  conditions = {Language = ["en", "en-US", "en-GB", "en-AU", "en-CA", "en-NZ", "en-ZA"]}

[[redirects]]
  from = "/"
  to = "/it/"
  status = 302
  force = false
  conditions = {Language = ["it", "it-IT", "it-CH"]}

[[redirects]]
  from = "/"
  to = "/es/"
  status = 302
  force = false
  conditions = {Language = ["es", "es-ES", "es-MX", "es-AR", "es-CO", "es-CL", "es-PE", "es-VE", "es-EC", "es-GT", "es-CU", "es-BO", "es-DO", "es-HN", "es-PY", "es-SV", "es-NI", "es-CR", "es-PA", "es-UY"]}

[[redirects]]
  from = "/"
  to = "/ar/"
  status = 302
  force = false
  conditions = {Language = ["ar", "ar-SA", "ar-EG", "ar-DZ", "ar-MA", "ar-TN", "ar-LY", "ar-IQ", "ar-JO", "ar-KW", "ar-LB", "ar-OM", "ar-QA", "ar-SD", "ar-SY", "ar-YE", "ar-AE", "ar-BH"]}

# Français par défaut — aucune redirection nécessaire (/ = FR)

# ── Headers de sécurité ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Cache assets statiques ──
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
